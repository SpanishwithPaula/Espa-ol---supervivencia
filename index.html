function startGame(g,review=false){cancel();game=g;index=0;correct=0;answered=false;retried=false;let source=g==='listen'?current.hear:current.phrases;let type=g==='listen'?'h':'p';round=source.map((p,i)=>({p,i,id:rowid(type,i)}));if(review)round=round.filter(x=>state.mistakes.includes(x.id));round=shuffle(round).slice(0,8);if(!round.length){toast('No hay errores pendientes en estas frases. / No pending mistakes in these phrases.');return}if(g==='match'){matchGame();return}gameQuestion()}
